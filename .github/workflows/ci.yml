name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs exactly the channel, targets and components pinned in
      # rust-toolchain.toml, so CI builds with what contributors use locally.
      - name: Install Rust
        run: rustup show

      # Job-scoped exact keys keep coverage and regular build artifacts separate.
      # A lockfile change creates a cold cache.
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Tests run first so a formatting nit can never hide a failing
      # invariant test.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codespell
        run: python -m pip install codespell==2.4.1

      - name: Check Markdown links and spelling
        run: make lint-docs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true

  # The invariant fuzz test runs 48 cases locally. Here it runs far deeper, in
  # its own job so a slow run never hides a failing unit test.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Check standalone fuzz crate
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml

      - name: Fuzz CAP, INTERVAL and REVOCATION (500 cases)
        env:
          PROPTEST_CASES: "500"
        run: cargo test -p subscription fuzz

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Same artifacts as `stellar contract build`, without compiling the
      # Stellar CLI in CI.
      - name: Build contracts (wasm)
        run: cargo build --workspace --release --target wasm32v1-none

      - name: Report wasm sizes
        run: ls -l target/wasm32v1-none/release/*.wasm

      # Fail the build if any contract's wasm exceeds the budget recorded in
      # .github/wasm-size-budget.json. To raise a budget, run:
      #   make wasm && scripts/check-wasm-size.sh --update
      # and commit the updated file with a PR comment explaining why.
      # See docs/wasm-size-budget.md for the full process.
      - name: Check wasm size budgets
        run: |
          set +e
          bash scripts/check-wasm-size.sh
          STATUS=$?
          bash scripts/check-wasm-size.sh --json > wasm-sizes.json
          {
            echo "### Wasm size report"
            echo '```json'
            cat wasm-sizes.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Upload wasm size artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sizes
          path: wasm-sizes.json

  # Rejects PRs that change the wasm size budget without a manual approval.
  # A maintainer approves by adding the `size-budget-approved` label; the
  # workflow re-runs on `labeled`/`unlabeled` events. See
  # docs/wasm-size-budget.md for the review process.
  wasm-size-budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect budget changes
        id: budget
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          if git diff --name-only "$BASE"...HEAD | grep -qx '.github/wasm-size-budget.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require approval for budget changes
        if: steps.budget.outputs.changed == 'true'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"size-budget-approved"'; then
            echo "Budget change approved via size-budget-approved label."
          else
            echo "::error::.github/wasm-size-budget.json was modified without approval."
            echo "A maintainer must add the 'size-budget-approved' label after reviewing the justification comment."
            echo "See docs/wasm-size-budget.md for the process."
            exit 1
          fi
